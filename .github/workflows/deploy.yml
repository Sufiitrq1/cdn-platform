name: Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Manually setting these for the Floci emulator
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566 # Floci endpoint

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Skip configure-aws-credentials and just run the CLI commands
      - name: Sync files to S3
        run: aws s3 sync ./assets s3://enterprise-assets --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id E63FYY33MW84NG --paths "/*"